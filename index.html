<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5c33b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Für Ronjo">
<title>Für Ronjo</title>
<style>
  :root {
    --bg: #f4ecd8;
    --bg-deep: #ecdfbe;
    --sky: #fbf3e0;
    --surface: #fffbf1;
    --surface-border: #e8d9b6;
    --ink: #5b4636;
    --ink-soft: #8a7358;
    --duck: #f5c33b;
    --duck-dark: #dfa726;
    --bill: #eb8b3b;
    --heart: #e88a93;
    --sea: #8fc1be;
    --sea-deep: #5fa6a0;
    --shadow: 0 18px 40px -20px rgba(91, 70, 54, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #241d13;
      --bg-deep: #1a150e;
      --sky: #2c2317;
      --surface: #362c1e;
      --surface-border: #4a3c28;
      --ink: #f3e9d2;
      --ink-soft: #c9b896;
      --duck: #f0be3e;
      --duck-dark: #d29f28;
      --bill: #e8873a;
      --heart: #e88a93;
      --sea: #4d8c87;
      --sea-deep: #386863;
      --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #241d13;
    --bg-deep: #1a150e;
    --sky: #2c2317;
    --surface: #362c1e;
    --surface-border: #4a3c28;
    --ink: #f3e9d2;
    --ink-soft: #c9b896;
    --duck: #f0be3e;
    --duck-dark: #d29f28;
    --bill: #e8873a;
    --heart: #e88a93;
    --sea: #4d8c87;
    --sea-deep: #386863;
    --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(32px, 8vh, 64px) 16px 48px;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 30%, var(--bg) 30%, var(--bg-deep) 100%);
    overflow: hidden;
  }

  .sun {
    position: absolute;
    top: clamp(18px, 5vh, 36px);
    right: clamp(16px, 8vw, 64px);
    width: clamp(56px, 10vw, 84px);
    height: clamp(56px, 10vw, 84px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9ad, var(--duck) 70%);
    box-shadow: 0 0 0 9px color-mix(in srgb, var(--duck) 18%, transparent);
  }

  .float-duck {
    position: absolute;
    opacity: 0.85;
    pointer-events: none;
  }
  .float-duck.d1 { top: 6%;  left: 6%;  width: 40px; animation: bob 5.5s ease-in-out infinite; }
  .float-duck.d2 { top: 12%; left: 80%; width: 30px; animation: bob 4.5s ease-in-out infinite -1.2s; }

  .float-heart {
    position: absolute;
    font-size: 1.1rem;
    opacity: 0.75;
    pointer-events: none;
  }
  .float-heart.h1 { top: 3%;  left: 46%; animation: bob 5s ease-in-out infinite -0.6s; }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-8px) rotate(2deg); }
    }
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--duck) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--duck-dark) 40%, transparent);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(1.8rem, 7vw, 2.5rem);
    line-height: 1.15;
    text-align: center;
    margin: 0 0 8px;
    text-wrap: balance;
    font-weight: 800;
  }

  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.98rem;
    margin: 0 0 32px;
    max-width: 32ch;
  }

  .deck {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1.5px solid var(--surface-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease;
  }
  .item:hover { transform: translateY(-2px); }
  .item:active { transform: translateY(0) scale(0.99); }
  .item:focus-visible { outline: 3px solid var(--sea-deep); outline-offset: 3px; }

  .item-icon {
    flex: none;
    width: 54px;
    height: 54px;
    border-radius: 16px;
    background: linear-gradient(180deg, #ffdd6b, var(--duck));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    box-shadow: 0 6px 14px -8px color-mix(in srgb, var(--duck-dark) 70%, transparent);
  }

  .item-text { flex: 1; min-width: 0; }
  .item-title { font-weight: 800; font-size: 1.05rem; margin: 0 0 2px; }
  .item-desc { font-size: 0.86rem; color: var(--ink-soft); margin: 0; }

  .item-arrow {
    flex: none;
    font-size: 1.2rem;
    color: var(--ink-soft);
  }

  .item.placeholder {
    background: transparent;
    border: 1.5px dashed var(--surface-border);
    box-shadow: none;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 0.88rem;
    font-weight: 700;
    text-align: center;
  }
  .item.placeholder:hover { transform: none; }

  .footer-note {
    margin-top: 34px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    max-width: 30ch;
  }

  .wave-bottom {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    line-height: 0;
    z-index: 0;
  }
  .wave-bottom svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>

<div class="stage">
  <div class="sun"></div>
  <svg class="float-duck d1" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="46" cy="54" rx="30" ry="20" fill="var(--duck)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="70" cy="30" r="15" fill="var(--duck)" stroke="var(--ink)" stroke-width="3"/>
    <path d="M83 30 Q95 28 91 36 Q84 37 83 30Z" fill="var(--bill)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="75" cy="26" r="2" fill="var(--ink)"/>
    <path d="M28 48 Q40 40 50 50" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <svg class="float-duck d2" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="46" cy="54" rx="30" ry="20" fill="var(--duck)" stroke="var(--ink)" stroke-width="3"/>
    <circle cx="70" cy="30" r="15" fill="var(--duck)" stroke="var(--ink)" stroke-width="3"/>
    <path d="M83 30 Q95 28 91 36 Q84 37 83 30Z" fill="var(--bill)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="75" cy="26" r="2" fill="var(--ink)"/>
    <path d="M28 48 Q40 40 50 50" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <span class="float-heart h1" aria-hidden="true">💛</span>

  <div class="content">
    <span class="eyebrow">🌊 Immer wieder neu</span>
    <h1>Hey Ronjo 💛</h1>
    <p class="subtitle">Hier sammle ich kleine Überraschungen für dich. Es kommt immer mal wieder was Neues dazu.</p>

    <div class="deck">
      <a class="item" href="activities/strandtag.html">
        <span class="item-icon">🌊</span>
        <span class="item-text">
          <p class="item-title">Strandtag-Check</p>
          <p class="item-desc">Ein süßes Ja/Nein-Quiz vor unserem Strandtag</p>
        </span>
        <span class="item-arrow">→</span>
      </a>

      <div class="item placeholder">✨ Hier kommt bald mehr dazu</div>
    </div>

    <p class="footer-note">Für dich gemacht, mit ganz viel Liebe 💛</p>
  </div>

  <div class="wave-bottom">
    <svg viewBox="0 0 400 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 20 Q25 34 50 20 T100 20 T150 20 T200 20 T250 20 T300 20 T350 20 T400 20 V40 H0 Z" fill="var(--sea-deep)" opacity="0.5"/>
    </svg>
  </div>
</div>

</body>
</html>
