<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1030">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Für Ronjo">
<title>Für Ronjo</title>
<script>
  // Wenn schon mal ein Profil gewählt wurde, direkt dorthin weiterleiten.
  (function () {
    var p = localStorage.getItem('ronjo_profile');
    if (p === 'me') location.replace('home-me.html');
    else if (p === 'ronjo') location.replace('home-ronjo.html');
  })();
</script>
<style>
  :root {
    --bg-top: #251840;
    --bg-bottom: #0a0614;
    --surface: rgba(255, 255, 255, 0.07);
    --surface-border: rgba(255, 255, 255, 0.14);
    --surface-hover: rgba(255, 255, 255, 0.11);
    --ink: #f4eef9;
    --ink-soft: #b9a9c8;
    --purple: #a98ce0;
    --purple-deep: #7c5cc0;
    --purple-glow: rgba(139, 95, 191, 0.45);
    --red: #e2685f;
    --red-deep: #c14a42;
    --red-glow: rgba(226, 104, 95, 0.35);
    --shadow: 0 20px 44px -18px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-bottom);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .stage {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-right: 16px;
    padding-bottom: 24px;
    padding-left: 16px;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 75%);
    overflow: hidden;
  }

  .stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .stars circle.tw { animation: twinkle 4s ease-in-out infinite; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }

  .nebula {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 10%, var(--purple-glow), transparent 60%),
      radial-gradient(ellipse 55% 45% at 90% 85%, var(--red-glow), transparent 60%);
    pointer-events: none;
  }

  .planet {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .planet.a {
    top: -46px;
    right: -40px;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle at 34% 30%, #d8c7f0, var(--purple) 55%, #4f3679 100%);
    box-shadow: 0 0 60px -10px var(--purple-glow);
  }
  .planet.a::after {
    content: "";
    position: absolute;
    left: -22px;
    top: 58px;
    width: 194px;
    height: 34px;
    border: 3px solid rgba(216, 199, 240, 0.55);
    border-radius: 50%;
    transform: rotate(-11deg);
  }
  .planet.b {
    bottom: 6%;
    left: -34px;
    width: 76px;
    height: 76px;
    background: radial-gradient(circle at 38% 32%, #f3a89f, var(--red) 55%, #7c332d 100%);
    box-shadow: 0 0 34px -6px var(--red-glow);
  }
  .planet.b::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(124, 51, 45, 0.55);
    top: 18px;
    left: 40px;
    box-shadow: 22px 14px 0 -2px rgba(124, 51, 45, 0.4);
  }

  .float-heart {
    position: absolute;
    pointer-events: none;
  }
  .float-heart svg { width: 100%; height: 100%; display: block; }
  .float-heart.h1 { top: 10%; left: 12%; width: 22px; animation: bob 5.5s ease-in-out infinite; }
  .float-heart.h2 { top: 68%; left: 84%; width: 18px; animation: bob 4.6s ease-in-out infinite -1.4s; opacity: 0.85; }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-7px) rotate(4deg); }
    }
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: linear-gradient(90deg, color-mix(in srgb, var(--purple) 22%, transparent), color-mix(in srgb, var(--red) 22%, transparent));
    border: 1px solid var(--surface-border);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(1.6rem, 6.5vw, 2.1rem);
    line-height: 1.15;
    text-align: center;
    margin: 0 0 8px;
    text-wrap: balance;
    font-weight: 800;
  }

  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 0 0 30px;
    max-width: 32ch;
  }

  .profiles {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .profile-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    backdrop-filter: blur(6px);
    border: 2px solid var(--surface-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 20px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    font: inherit;
    text-align: left;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .profile-card:hover { transform: translateY(-2px); background: var(--surface-hover); }
  .profile-card:active { transform: translateY(0) scale(0.99); }
  .profile-card:focus-visible { outline: 3px solid var(--red-deep); outline-offset: 3px; }
  .profile-card.purple:hover { border-color: var(--purple); }
  .profile-card.red:hover { border-color: var(--red); }

  .profile-icon {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }
  .profile-card.purple .profile-icon { background: color-mix(in srgb, var(--purple) 30%, transparent); }
  .profile-card.red .profile-icon { background: color-mix(in srgb, var(--red) 30%, transparent); }

  .profile-title { font-weight: 800; font-size: 1.15rem; margin: 0; }
</style>
</head>

  <div class="nebula" aria-hidden="true"></div>
  <div class="planet a" aria-hidden="true"></div>
  <div class="planet b" aria-hidden="true"></div>

  <span class="float-heart h1" aria-hidden="true">
    <svg viewBox="0 0 32 28" xmlns="http://www.w3.org/2000/svg"><path d="M16 26 C4 18 1 11 5 6 C8 2 14 3 16 8 C18 3 24 2 27 6 C31 11 28 18 16 26Z" fill="var(--purple)" stroke="#2a2038" stroke-width="2" stroke-linejoin="round"/></svg>
  </span>
  <span class="float-heart h2" aria-hidden="true">
    <svg viewBox="0 0 32 28" xmlns="http://www.w3.org/2000/svg"><path d="M16 26 C4 18 1 11 5 6 C8 2 14 3 16 8 C18 3 24 2 27 6 C31 11 28 18 16 26Z" fill="var(--red)" stroke="#2a2038" stroke-width="2" stroke-linejoin="round"/></svg>
  </span>

  <div class="content">
    <span class="eyebrow">🫶 Wer bist du?</span>
    <h1>Für wen ist die App gerade?</h1>
    <p class="subtitle">Wähl dein Profil – du kannst später jederzeit wechseln.</p>

    <div class="profiles">
      <button class="profile-card purple" data-profile="me" type="button">
        <span class="profile-icon">💜</span>
        <span class="profile-title">Max</span>
      </button>

      <button class="profile-card red" data-profile="ronjo" type="button">
        <span class="profile-icon">❤️</span>
        <span class="profile-title">Ronjo</span>
      </button>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.profile-card').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var profile = btn.getAttribute('data-profile');
      localStorage.setItem('ronjo_profile', profile);
      location.href = profile === 'me' ? 'home-me.html' : 'home-ronjo.html';
    });
  });
</script>

</html>
